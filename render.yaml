databases:
  - name: helpdesks-db
    plan: free
    databaseName: helpdesk
    user: helpdesk

services:
  - name: helpdesks
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesks-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Render assigns this service the URL https://helpdesks.onrender.com
      # (the service `name` above) unless that name is already taken, in
      # which case Render picks a different subdomain — check the actual
      # assigned URL after the first deploy and update these two (then
      # redeploy) if it doesn't match.
      - key: BETTER_AUTH_URL
        value: https://helpdesks.onrender.com
      - key: CLIENT_ORIGIN
        value: https://helpdesks.onrender.com
      # Render sets the first (leftmost) X-Forwarded-For entry to the real
      # client IP itself — a client can't inject a fake one ahead of it —
      # so trusting every hop and taking the leftmost is safe here, same
      # reasoning as the Railway deployment doc. See CLAUDE.md's "Rate
      # limiting" for what this feeds into.
      - key: TRUSTED_PROXY_CIDRS
        value: "0.0.0.0/0,::/0"
      - key: EMAIL_INGEST_SECRET
        generateValue: true
      # Filled in during Blueprint creation (Render prompts for every
      # `sync: false` var then) or later from the service's Environment
      # tab. See server/.env.example for what each gates.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
